name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'client/src/**'
      - 'client/package.json'
      - '.github/workflows/deploy-cloud.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing GitHub secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID — deploy skipped. Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            cloud/package-lock.json

      - name: Build web dashboard
        if: steps.creds.outputs.ready == 'true'
        working-directory: client
        run: |
          npm ci
          npm run build:web

      - name: Sync SPA into cloud/public
        if: steps.creds.outputs.ready == 'true'
        run: |
          # Vite web build lands in client/dist (finalize-web-dist renames index).
          # Keep logos / favicons already in cloud/public; replace hashed assets + index.
          test -f client/dist/index.html
          test -d client/dist/assets
          rm -rf cloud/public/assets
          mkdir -p cloud/public/assets
          cp -r client/dist/assets/* cloud/public/assets/
          cp client/dist/index.html cloud/public/index.html
          for f in lama-mark.svg logo-full.svg; do
            if [ -f "client/dist/$f" ]; then cp "client/dist/$f" cloud/public/; fi
            if [ -f "web/$f" ]; then cp "web/$f" cloud/public/; fi
          done

      - name: Install cloud deps
        if: steps.creds.outputs.ready == 'true'
        working-directory: cloud
        run: npm ci

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
