[workspace]
resolver = "2"
members = [
    "crates/screenraid-types",
    "crates/screenraid-validation",
    "server",
    "client/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["ScreenRaid Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }
screenraid-types = { path = "crates/screenraid-types" }
screenraid-validation = { path = "crates/screenraid-validation" }
