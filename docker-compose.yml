services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${BIND_HOST:-0.0.0.0}:8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:///data/screenraid.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - STORAGE_PATH=/data/media
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:1420,tauri://localhost}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
      - ALLOW_SELF_PRANK=${ALLOW_SELF_PRANK:-false}
      - RUST_LOG=screenraid_server=info
    volumes:
      - screenraid-data:/data
    restart: unless-stopped

volumes:
  screenraid-data:
